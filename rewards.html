<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOBANK</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .points-banner {
            background: linear-gradient(135deg, #1e2329 0%, #15181d 100%);
            border: 1px solid var(--primary-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(178,255,89,0.1);
        }
        .my-points {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-color);
        }
        .points-label { font-size: 14px; color: #848e9c; }

        /* Grid ของรางวัล */
        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .reward-card {
            background: #1e2329;
            border: 1px solid #2b3139;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .reward-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .reward-icon { font-size: 50px; margin-bottom: 15px; display: inline-block; }
        .reward-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; color: #fff; }
        .reward-desc { font-size: 12px; color: #848e9c; margin-bottom: 15px; height: 32px; overflow: hidden; }
        
        .reward-cost {
            background: rgba(178, 255, 89, 0.1);
            color: var(--primary-color);
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }

        .btn-redeem {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-redeem:hover {
            background: var(--primary-color);
            color: #000;
        }
        .btn-redeem:disabled {
            border-color: #444; color: #666; cursor: not-allowed; background: transparent;
        }
    </style>
</head>
<body>
    <header class="header"></header>

    <main class="container animate-fade-in">
        <div class="page-title">🎁 แลกของรางวัล</div>
        <p class="page-subtitle">ใช้แต้มสะสมของคุณแลกรับของรางวัลรักษ์โลก</p>

        <div class="points-banner">
            <div>
                <div class="points-label">แต้มสะสมของคุณ</div>
                <div class="my-points" id="userPoints">...</div>
            </div>
            <div style="font-size: 40px;">🪙</div>
        </div>

        <div id="rewardsList" class="rewards-grid">
            <div style="text-align:center; grid-column: 1/-1; color:#666; padding: 40px;">กำลังโหลดของรางวัล...</div>
        </div>

        <footer class="site-footer"></footer>
    </main>

    <script type="module">
        import { 
            getRewards, getUserWallet, redeemReward, seedInitialData, showPopup, showConfirm 
        } from "./js/firebase-service.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { auth } from "./js/firebase-config.js";
        import { renderHeader, renderFooter } from "./js/components.js";

        // 1. Render Components
        renderHeader('rewards');
        renderFooter();

        let currentUser = null;
        let userPoints = 0;

        // 2. Auth Logic
        onAuthStateChanged(auth, async (user) => {
            const authSection = document.getElementById('authSection');
            if (user) {
                currentUser = user;
                
                // Dropdown UI
                if(authSection) {
                    authSection.innerHTML = `
                        <div class="user-dropdown">
                            <div class="user-btn">
                                <div class="user-avatar-xs">👤</div>
                                <span>${user.email.split('@')[0]}</span>
                                <span style="font-size:10px; color:#888;">▼</span>
                            </div>
                            <div class="dropdown-content">
                                <a href="profile.html">👤 ข้อมูลส่วนตัว (Profile)</a>
                                <a href="wallet.html">💰 กระเป๋าเงิน (Wallet)</a>
                                <a href="#" id="logoutBtn" class="logout-item">🚪 ออกจากระบบ</a>
                            </div>
                        </div>
                    `;
                    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                        e.preventDefault();
                        if(await showConfirm("ยืนยัน", "ต้องการออกจากระบบ?")) {
                            await signOut(auth);
                            window.location.href = 'login.html';
                        }
                    });
                }

                // ... (โค้ดโหลดข้อมูลอื่นๆ ของคุณ เช่น loadWalletData หรือ loadStats) ...
                if (typeof loadUserData === 'function') await loadUserData();

            } else {
                // กรณีไม่ได้ Login
                currentUser = null;
                if(authSection) authSection.innerHTML = `<div style="display:flex; gap:10px;"><a href="login.html" class="btn btn-login">เข้าสู่ระบบ</a><a href="register.html" class="btn btn-register">สมัครสมาชิก</a></div>`;
                loadRewards(); // Load rewards for guest
            }
        });

        async function loadUserData() {
            if (!currentUser) return;
            const wallet = await getUserWallet(currentUser.uid);
            userPoints = wallet ? (wallet.points || 0) : 0;
            animateValue("userPoints", 0, userPoints, 1000);
            loadRewards(); // Reload rewards to check enabled/disabled buttons
        }

        async function loadRewards() {
            const container = document.getElementById('rewardsList');
            const rewards = await getRewards();

            if (rewards.length === 0) {
                container.innerHTML = '<div style="text-align:center; grid-column: 1/-1; color:#666;">ยังไม่มีของรางวัลในระบบ</div>';
                return;
            }

            container.innerHTML = rewards.map(r => {
                let btnText = "แลกเลย";
                let btnDisabled = false;
                let btnClass = "";

                if (!currentUser) {
                    btnText = "เข้าสู่ระบบเพื่อแลก";
                    btnDisabled = true;
                } else if (userPoints < r.cost) {
                    btnText = "แต้มไม่พอ";
                    btnDisabled = true;
                }

                return `
                <div class="reward-card">
                    <div class="reward-icon">${r.icon}</div>
                    <div class="reward-name">${r.name}</div>
                    <div class="reward-desc">${r.desc}</div>
                    <div class="reward-cost">${r.cost} แต้ม</div>
                    <button class="btn-redeem" ${btnDisabled ? 'disabled' : ''} 
                        onclick="triggerRedeem('${r.id}', '${r.name}', ${r.cost})">
                        ${btnText}
                    </button>
                </div>`;
            }).join('');
        }

        window.triggerRedeem = async (id, name, cost) => {
            if (!currentUser) return window.location.href = 'login.html';
            
            if (await showConfirm("ยืนยันการแลก", `ต้องการแลก "${name}" ใช้ ${cost} แต้ม?`)) {
                const result = await redeemReward(currentUser.uid, { id, name, cost });
                
                if (result.success) {
                    await showPopup("สำเร็จ", "แลกของรางวัลเรียบร้อยแล้ว!", "success");
                    loadUserData(); // รีโหลดแต้มใหม่
                } else {
                    await showPopup("ผิดพลาด", result.message, "error");
                }
            }
        };

        // Admin Seed
        window.seedRewards = async () => {
            if(await showConfirm("Admin Only", "ต้องการลงข้อมูลของรางวัลเริ่มต้นหรือไม่?")) {
                await seedInitialData();
                showPopup("สำเร็จ", "ลงข้อมูลเรียบร้อย", "success");
                loadRewards();
            }
        };

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id); if(!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start).toLocaleString();
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }
    </script>
</body>
</html>
