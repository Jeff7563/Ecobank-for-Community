<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOBANK</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Podium Section */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin: 40px auto 60px;
            gap: 20px;
            max-width: 600px;
        }

        .podium-item {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex: 1;
        }

        .rank-avatar {
            width: 70px; height: 70px;
            background: #2b3139; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; border: 3px solid #2b3139;
            margin-bottom: 10px; position: relative; z-index: 2;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .rank-bar {
            width: 100%; border-radius: 12px 12px 0 0;
            display: flex; align-items: flex-end; justify-content: center;
            font-weight: 800; font-size: 40px; color: rgba(0,0,0,0.5);
            padding-bottom: 10px; position: relative;
        }

        /* Rank 1 */
        .rank-1 .rank-bar { height: 180px; background: linear-gradient(to top, #ffd700, #fffacd); box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); }
        .rank-1 .rank-avatar { border-color: #ffd700; width: 90px; height: 90px; font-size: 40px; transform: translateY(-10px); }
        .crown { position: absolute; top: -35px; font-size: 36px; animation: float 2s infinite ease-in-out; filter: drop-shadow(0 0 10px gold); }

        /* Rank 2 */
        .rank-2 .rank-bar { height: 130px; background: linear-gradient(to top, #c0c0c0, #e0e0e0); }
        .rank-2 .rank-avatar { border-color: #c0c0c0; }

        /* Rank 3 */
        .rank-3 .rank-bar { height: 100px; background: linear-gradient(to top, #cd7f32, #f4a460); }
        .rank-3 .rank-avatar { border-color: #cd7f32; }

        .player-name { font-weight: bold; margin-bottom: 2px; color: #fff; font-size: 14px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .player-points { font-size: 12px; color: var(--primary-color); font-weight: 600; margin-bottom: 5px; }

        /* --- List Section (ส่วนที่เพิ่มมาให้หายโล่ง) --- */
        .ranking-list-container {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #2b3139;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 80px; /* เว้นที่ให้ปุ่มด้านล่าง */
        }

        .list-header {
            display: flex; justify-content: space-between; padding: 0 15px 10px;
            border-bottom: 1px solid #2b3139; margin-bottom: 10px;
            color: var(--text-muted); font-size: 13px; text-transform: uppercase;
        }

        .rank-row {
            display: flex; align-items: center; padding: 15px;
            border-radius: 12px; transition: 0.2s; margin-bottom: 5px;
            border: 1px solid transparent;
        }
        .rank-row:hover { background: rgba(255,255,255,0.03); border-color: #2b3139; transform: translateX(5px); }

        .list-rank { width: 40px; font-weight: 700; color: var(--text-muted); font-size: 16px; text-align: center; }
        .list-avatar { width: 40px; height: 40px; background: #0b0e11; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; border: 1px solid #2b3139; }
        .list-info { flex: 1; }
        .list-name { font-weight: 600; color: #eaecef; font-size: 15px; }
        .list-community { font-size: 12px; color: var(--text-muted); }
        .list-points { font-weight: 700; color: var(--primary-color); font-size: 16px; }

        /* My Rank Bar (Sticky Bottom) */
        .my-rank-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 600px;
            background: rgba(30, 35, 41, 0.9); backdrop-filter: blur(10px);
            border: 1px solid var(--primary-color);
            border-radius: 50px; padding: 10px 20px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body>

    <header class="header"></header>

    <main class="container animate-fade-in">
        <div style="text-align: center; margin-bottom: 20px;">
            <div class="page-title">🏆 Hall of Fame</div>
            <p class="page-subtitle">สุดยอดนักแยกขยะประจำชุมชน (วัดจากแต้มสะสม)</p>
        </div>

        <div id="podiumArea" class="podium-container animate-slide-up">
            <div style="width:100%; text-align:center; color:#666;">กำลังโหลดข้อมูล...</div>
        </div>

        <div id="listContainer" class="ranking-list-container animate-slide-up" style="display:none;">
            <div class="list-header">
                <div style="width: 40px; text-align: center;">#</div>
                <div style="flex: 1;">ผู้ใช้งาน</div>
                <div>แต้มสะสม</div>
            </div>
            <div id="listArea"></div>
        </div>

        <footer class="site-footer"></footer>

    </main>

    <div id="myRankBar" class="my-rank-bar animate-slide-up" style="display:none;">
        <div style="display:flex; align-items:center; gap:15px;">
            <div class="list-avatar" style="border-color:var(--primary-color);">👤</div>
            <div>
                <div style="font-size:12px; color:#888;">อันดับของคุณ</div>
                <div style="font-weight:bold; color:#fff;" id="myRankName">Loading...</div>
            </div>
        </div>
        <div style="text-align:right;">
            <div style="font-size:20px; font-weight:800; color:var(--primary-color);" id="myRankNum"># -</div>
            <div style="font-size:11px; color:#888;" id="myRankPoints">0 แต้ม</div>
        </div>
    </div>

    <script type="module">
        import { getLeaderboard, showConfirm } from "./js/firebase-service.js"; // Added showConfirm
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { auth } from "./js/firebase-config.js";
        import { renderHeader, renderFooter } from "./js/components.js";

        // 1. Render Components
        renderHeader('rank');
        renderFooter();

        // 2. Auth Logic
        let currentUserUid = null;
        onAuthStateChanged(auth, (user) => {
            const authSection = document.getElementById('authSection');
            if (user) {
                currentUserUid = user.uid;
                if(authSection) {
                    authSection.innerHTML = `
                        <div class="user-dropdown">
                            <div class="user-btn">
                                <div class="user-avatar-xs">👤</div>
                                <span>${user.email.split('@')[0]}</span>
                                <span style="font-size:10px; color:#888;">▼</span>
                            </div>
                            <div class="dropdown-content">
                                <a href="profile.html">👤 ข้อมูลส่วนตัว (Profile)</a>
                                <a href="wallet.html">💰 กระเป๋าเงิน (Wallet)</a>
                                <a href="#" id="logoutBtn" class="logout-item">🚪 ออกจากระบบ</a>
                            </div>
                        </div>
                    `;
                    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                        e.preventDefault();
                        if(await showConfirm("ยืนยัน", "ออกจากระบบ?")) {
                            await signOut(auth);
                             window.location.href = 'login.html';
                        }
                    });
                }
            } else {
                if(authSection) authSection.innerHTML = `<a href="login.html" class="btn btn-login">เข้าสู่ระบบ</a><a href="register.html" class="btn btn-register">สมัครสมาชิก</a>`;
            }
            initLeaderboard(); // โหลดข้อมูลหลังเช็ค Auth เสร็จ
        });

        // Main Logic
        async function initLeaderboard() {
            const users = await getLeaderboard();
            const podiumEl = document.getElementById('podiumArea');
            const listContainer = document.getElementById('listContainer');
            const listEl = document.getElementById('listArea');

            if (users.length === 0) {
                podiumEl.innerHTML = '<div style="text-align:center; color:#666;">ยังไม่มีข้อมูลการจัดอันดับ</div>';
                return;
            }

            // แยก Top 3
            const top3 = [
                users[1] || { username: '-', points: 0 }, // Rank 2
                users[0] || { username: '-', points: 0 }, // Rank 1
                users[2] || { username: '-', points: 0 }  // Rank 3
            ];

            // Render Podium
            let podiumHTML = '';
            // Rank 2
            podiumHTML += createPodiumItem(top3[0], 2);
            // Rank 1
            podiumHTML += createPodiumItem(top3[1], 1);
            // Rank 3
            podiumHTML += createPodiumItem(top3[2], 3);

            podiumEl.innerHTML = podiumHTML;

            // Render List (Rank 4+)
            const others = users.slice(3);
            if (others.length > 0) {
                listContainer.style.display = 'block';
                listEl.innerHTML = others.map((u, index) => `
                    <div class="rank-row">
                        <div class="list-rank">${index + 4}</div>
                        <div class="list-avatar">👤</div>
                        <div class="list-info">
                            <div class="list-name">${u.username}</div>
                            <div class="list-community">📍 ${u.community || 'ทั่วไป'}</div>
                        </div>
                        <div class="list-points">${u.points || 0}</div>
                    </div>
                `).join('');
            } else {
                listContainer.style.display = 'block';
                listEl.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">ยังไม่มีผู้เล่นอันดับ 4-10</div>';
            }

            // Update My Rank Bar
            if (currentUserUid) {
                const myRankIndex = users.findIndex(u => u.id === currentUserUid);
                if (myRankIndex !== -1) {
                    const myData = users[myRankIndex];
                    document.getElementById('myRankBar').style.display = 'flex';
                    document.getElementById('myRankName').innerText = myData.username;
                    document.getElementById('myRankNum').innerText = `# ${myRankIndex + 1}`;
                    document.getElementById('myRankPoints').innerText = `${myData.points} แต้ม`;
                }
            }
        }

        function createPodiumItem(user, rank) {
            const crown = rank === 1 ? '<div class="crown">👑</div>' : '';
            const opacity = user.username === '-' ? '0.3' : '1';
            return `
                <div class="podium-item rank-${rank}" style="opacity:${opacity}">
                    ${crown}
                    <div class="rank-avatar">👤</div>
                    <div class="player-name">${user.username}</div>
                    <div class="player-points">${user.points || 0} แต้ม</div>
                    <div class="rank-bar">${rank}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
