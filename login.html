<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOBANK</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <a href="index.html" class="back-home">← กลับหน้าหลัก</a>

    <div class="auth-card animate-slide-up">
        <div class="auth-header">
            <div style="font-size: 40px; margin-bottom: 10px;">🌿</div>
            <h2>Welcome Back</h2>
            <p style="color: #848e9c; font-size: 14px;">เข้าสู่ระบบเพื่อจัดการบัญชีของคุณ</p>
        </div>

        <form id="loginForm">
            <div class="input-box">
                <input type="email" id="email" required>
                <label>อีเมล</label>
                <div class="input-line"></div>
            </div>

            <div class="input-box">
                <input type="password" id="password" required>
                <label>รหัสผ่าน</label>
                <div class="input-line"></div>
                <button type="button" class="toggle-pwd" id="togglePassword">👁️</button>
            </div>

            <button type="submit" class="auth-btn">เข้าสู่ระบบ</button>

            <div class="auth-link">
                <a href="#" id="forgotPwdBtn" style="color: #ffffff !important; font-size: 13px; font-weight: bold;">ลืมรหัสผ่าน?</a>
                <span style="margin: 0 10px; color: #333;">|</span>
                ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิกใหม่</a>
            </div>
        </form>
    </div>

    <!-- Modal Reset Password -->
    <div id="resetModal" class="modal">
        <div class="modal-box">
            <h3 style="color:#fff; margin-bottom:15px;">🔑 รีเซ็ตรหัสผ่าน</h3>
            <p style="color:#bbb; font-size:14px; margin-bottom: 20px;">
                กรุณากรอกอีเมลที่ใช้สมัคร <br>ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้
            </p>
            <input type="email" id="resetEmail" class="form-control" placeholder="example@email.com" 
                   style="width: 100%; padding: 12px; background: #0b0e11; border: 1px solid #2b3139; border-radius: 8px; color: #fff; margin-bottom: 20px;">
            
            <div style="display: flex; gap: 10px;">
                <button id="closeResetBtn" style="background: #2b3139; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; flex: 1;">ยกเลิก</button>
                <button id="confirmResetBtn" style="background: var(--primary-color); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold;">ส่งลิงก์</button>
            </div>
        </div>
    </div>

    <style>
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-box { background: #1e2329; border: 1px solid #2b3139; border-radius: 16px; padding: 30px; width: 90%; max-width: 400px; text-align: center; position: relative; animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>

    <script type="module">
        import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"; 
        import { auth, db } from "./js/firebase-config.js"; 
        import { showPopup } from "./js/firebase-service.js";

        // Toggle Password
        const pwdInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        toggleBtn.addEventListener('click', () => {
            const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
            pwdInput.setAttribute('type', type);
            toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Forgot Password Modal Logic
        const resetModal = document.getElementById('resetModal');
        const forgotBtn = document.getElementById('forgotPwdBtn');
        const closeResetBtn = document.getElementById('closeResetBtn');
        const confirmResetBtn = document.getElementById('confirmResetBtn');

        forgotBtn.addEventListener('click', (e) => {
            e.preventDefault();
            resetModal.classList.add('show');
        });

        closeResetBtn.addEventListener('click', () => {
            resetModal.classList.remove('show');
        });

        confirmResetBtn.addEventListener('click', async () => {
            const email = document.getElementById('resetEmail').value.trim();
            if (!email) {
                alert("กรุณากรอกอีเมล");
                return;
            }

            try {
                confirmResetBtn.textContent = "กำลังส่ง...";
                confirmResetBtn.disabled = true;

                await sendPasswordResetEmail(auth, email);
                
                resetModal.classList.remove('show');
                showPopup("ส่งสำเร็จ", "กรุณาเช็คอีเมลเพื่อตั้งรหัสผ่านใหม่", "success");
            } catch (error) {
                console.error("Reset Password Error:", error);
                
                let msg = "เกิดข้อผิดพลาด";
                if (error.code === 'auth/user-not-found') msg = "ไม่พบอีเมลนี้ในระบบ";
                if (error.code === 'auth/invalid-email') msg = "รูปแบบอีเมลไม่ถูกต้อง";
                
                showPopup("ผิดพลาด", msg, "error");
            } finally {
                confirmResetBtn.textContent = "ส่งลิงก์";
                confirmResetBtn.disabled = false;
            }
        });

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = pwdInput.value;
            const btn = e.target.querySelector('button[type="submit"]');

            try {
                // UI Loading
                btn.textContent = "Checking...";
                btn.disabled = true;
                btn.style.opacity = "0.7";

                // 1. ล็อกอินกับ Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. ✅ เช็ค Role ใน Firestore Database
                const userDocRef = doc(db, "users", user.uid); // อ้างอิงไปที่ collection 'users'
                const userDocSnap = await getDoc(userDocRef);

                let targetUrl = "index.html"; // ค่าเริ่มต้นไปหน้าแรก (User ทั่วไป)

                if (userDocSnap.exists()) {
                    const userData = userDocSnap.data();
                    
                    // ถ้ามี field role = 'admin' ให้ไปหน้า Dashboard
                    if (userData.role === 'admin') {
                        targetUrl = "admin-dashboard.html";
                    }
                }

                await showPopup("เข้าสู่ระบบสำเร็จ", "กำลังพาเข้าสู่ระบบ...", "success");
                window.location.href = targetUrl;

            } catch (error) {
                console.error("Login Error:", error);

                let msg = "เกิดข้อผิดพลาด กรุณาลองใหม่";
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    msg = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
                } else if (error.code === 'auth/too-many-requests') {
                    msg = "ลองบ่อยเกินไป โปรดรอสักครู่แล้วลองใหม่";
                } else if (error.code === 'auth/invalid-email') {
                    msg = "รูปแบบอีเมลไม่ถูกต้อง";
                } else {
                    msg = `System Error: ${error.code}`;
                }
                
                showPopup("เข้าสู่ระบบไม่สำเร็จ", msg, "error");
                
                // Reset Button
                btn.textContent = "เข้าสู่ระบบ";
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        });
    </script>
</body>
</html>
