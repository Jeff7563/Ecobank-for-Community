<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOBANK</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <style>
    </style>
</head>
<body>
    <header class="header"></header>

    <main class="container animate-fade-in">
        <div class="page-title">📦 ราคารับซื้อขยะ</div>
        <p class="page-subtitle">อัปเดตราคาล่าสุดประจำวัน (ราคาอาจมีการเปลี่ยนแปลงหน้าจุดรับซื้อ)</p>

        <div class="search-container">
            <span style="font-size: 20px; padding: 8px;">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาชื่อขยะ (เช่น ขวด, กระดาษ)...">
        </div>

        <div class="filter-pills" style="margin-bottom: 30px;">
            <button class="filter-btn active" onclick="filterCategory('all')">ทั้งหมด</button>
            <button class="filter-btn" onclick="filterCategory('พลาสติก')">พลาสติก</button>
            <button class="filter-btn" onclick="filterCategory('โลหะ')">โลหะ</button>
            <button class="filter-btn" onclick="filterCategory('กระดาษ')">กระดาษ</button>
            <button class="filter-btn" onclick="filterCategory('แก้ว')">แก้ว</button>
        </div>

        <div id="trashGrid" class="grid-cards animate-slide-up">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
                กำลังโหลดข้อมูล... ⏳
            </div>
        </div>

        <footer class="site-footer"></footer>
    </main>

    <script type="module">
        import { getTrashTypes, showConfirm } from "./js/firebase-service.js"; // Added showConfirm import
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { auth } from "./js/firebase-config.js";
        import { renderHeader, renderFooter } from "./js/components.js";

        // 1. Render Components
        renderHeader('price');
        renderFooter();

        let allTrashData = []; // ตัวแปรเก็บข้อมูลดิบ

        // 2. Auth Logic
        onAuthStateChanged(auth, (user) => {
            const authSection = document.getElementById('authSection');
            if (user) {
                if(authSection) {
                    authSection.innerHTML = `
                        <div class="user-dropdown">
                            <div class="user-btn">
                                <div class="user-avatar-xs">👤</div>
                                <span>${user.email.split('@')[0]}</span>
                                <span style="font-size:10px; color:#888;">▼</span>
                            </div>
                            <div class="dropdown-content">
                                <a href="profile.html">👤 ข้อมูลส่วนตัว (Profile)</a>
                                <a href="wallet.html">💰 กระเป๋าเงิน (Wallet)</a>
                                <a href="#" id="logoutBtn" class="logout-item">🚪 ออกจากระบบ</a>
                            </div>
                        </div>
                    `;
                    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                        e.preventDefault();
                        if(await showConfirm("ยืนยัน","ออกจากระบบ?")) {
                             await signOut(auth);
                             window.location.href = 'login.html';
                        }
                    });
                }
            } else {
                if(authSection) authSection.innerHTML = `<div style="display:flex; gap:10px;"><a href="login.html" class="btn btn-login">เข้าสู่ระบบ</a><a href="register.html" class="btn btn-register">สมัครสมาชิก</a></div>`;
            }
        });

        // 2. โหลดข้อมูลและแสดงผล
        async function initPage() {
            try {
                allTrashData = await getTrashTypes();
                renderGrid(allTrashData); // แสดงทั้งหมดรอบแรก
            } catch (error) {
                document.getElementById('trashGrid').innerHTML = `<p style="color:red; text-align:center;">เกิดข้อผิดพลาด: ${error.message}</p>`;
            }
        }

        // 3. ฟังก์ชันวาดการ์ด
        function renderGrid(data) {
            const grid = document.getElementById('trashGrid');
            
            if (data.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">ไม่พบข้อมูลที่ค้นหา</p>`;
                return;
            }

            grid.innerHTML = data.map(item => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                        <div class="card-icon">${item.icon || '📦'}</div>
                        <span style="font-size:12px; background:#2b3139; padding:4px 8px; border-radius:4px; color:var(--text-muted);">${item.category}</span>
                    </div>
                    <div class="card-title" style="margin-top:10px;">${item.name}</div>
                    <div style="display:flex; justify-content:space-between; align-items:end; margin-top:15px;">
                        <div>
                            <div style="font-size:12px; color:var(--text-muted);">ราคารับซื้อ</div>
                            <div class="card-value">฿${Number(item.price_per_unit || 0).toFixed(2)}</div>
                            <div style="font-size:11px; color:#ffeb3b; margin-top:2px; font-weight:bold;">+${item.points || 0} แต้ม</div>
                        </div>
                        <div style="font-size:12px; color:var(--text-muted);">ต่อ ${item.unit}</div>
                    </div>
                </div>
            `).join('');
        }

        // 4. ฟังก์ชันกรองข้อมูล (Search & Filter)
        window.filterCategory = (category) => {
            // ปรับ Active Class ปุ่ม
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // กรองข้อมูล
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allTrashData.filter(item => 
                (item.name.toLowerCase().includes(searchVal)) &&
                (category === 'all' || item.category === category)
            );
            renderGrid(filtered);
        }

        // Event Listener ช่องค้นหา
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const activeBtn = document.querySelector('.filter-btn.active');
            // จำลองการคลิกปุ่มเดิมเพื่อกรองใหม่
            activeBtn.click();
        });

        initPage();
    </script>
</body>
</html>
