<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | ECOBANK</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .error-container { padding: 40px; background: #1e2329; border-radius: 16px; border: 1px solid #2b3139; max-width: 500px; width: 90%; }
        .error-code { font-size: 80px; font-weight: 800; color: var(--primary-color); margin-bottom: 20px; }
        .error-msg { font-size: 18px; color: #fff; margin-bottom: 30px; }
        .btn-home { background: var(--primary-color); color: #000; padding: 12px 30px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .btn-home:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-msg">ขออภัย ไม่พบหน้าที่คุณค้นหา</h1>
        <p style="color:#888; margin-bottom:30px;">หน้านี้อาจถูกย้าย ลบ หรือคุณพิมพ์ URL ผิด</p>
        <a href="index.html" class="btn-home">กลับไปหน้าแรก</a>
    </div>
</body>
</html>
