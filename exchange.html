<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOBANK</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* CSS การ์ด (เหมือนเดิมเป๊ะ) */
        .schedule-card {
            background: #1e2329; border: 1px solid #2b3139; border-radius: 12px; padding: 20px;
            margin-bottom: 15px; transition: all 0.3s ease; cursor: pointer;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .schedule-card:hover { border-color: var(--primary-color); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .card-header-row { display: flex; align-items: center; width: 100%; z-index: 2; }
        .date-box { background: #2b3139; padding: 10px 15px; border-radius: 8px; text-align: center; margin-right: 20px; min-width: 60px; border: 1px solid #363c45; }
        .date-day { font-size: 24px; font-weight: bold; color: #fff; line-height: 1; }
        .date-month { font-size: 12px; color: #848e9c; margin-top: 5px; }
        .tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: rgba(178, 255, 89, 0.1); color: var(--primary-color); margin-right: 5px; display: inline-block; margin-top: 5px; }
        
        .card-details {
            max-height: 0; opacity: 0; overflow: hidden; transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            margin-top: 0; background: #15181d; border-radius: 8px;
        }
        /* Mobile Toggle Logic */
        .schedule-card.expanded .card-details {
            max-height: 1000px; opacity: 1; margin-top: 20px; padding: 20px; border-top: 1px solid #2b3139;
        }
        
        .detail-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .detail-table th { color: #848e9c; text-align: left; padding: 10px; border-bottom: 1px solid #2b3139; font-weight: 600; font-size: 12px; }
        .detail-table td { color: #eaecef; text-align: left; padding: 10px; border-bottom: 1px solid #23262f; font-size: 13px; }
        .detail-table tr:last-child td { border-bottom: none; }
        
        .expand-hint { font-size: 11px; color: #555; margin-top: 5px; transition: 0.3s; cursor: pointer; }
        .schedule-card.expanded .expand-hint { opacity: 0; }
        
        .st-open { color: #b2ff59; font-weight: bold; font-size: 14px; }
        .st-closed { color: #f6465d; font-weight: bold; font-size: 14px; }
        .st-wait { color: #f0b90b; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <header class="header"></header>

    <main class="container animate-fade-in">
        <div class="page-title">📅 ตารางกิจกรรมรับซื้อ</div>
        <p class="page-subtitle">ตรวจสอบรอบการรับซื้อขยะในชุมชนของคุณล่วงหน้า (ชี้ที่การ์ดเพื่อดูราคา)</p>

        <div id="scheduleList" class="animate-slide-up">
            <div style="text-align:center; color:#666; padding:40px;">กำลังโหลดตาราง...</div>
        </div>

        <footer class="site-footer"></footer>

    </main>

    <script type="module">
        import { getEvents, getTrashTypes, showConfirm } from "./js/firebase-service.js"; // Added showConfirm
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { auth } from "./js/firebase-config.js";
        import { renderHeader, renderFooter } from "./js/components.js";

        // 1. Render Components
        renderHeader('market');
        renderFooter();

        // 2. Auth
        onAuthStateChanged(auth, (user) => {
            const authSection = document.getElementById('authSection');
            if (user) {
                if(authSection) {
                    authSection.innerHTML = `
                        <div class="user-dropdown">
                            <div class="user-btn"><div class="user-avatar-xs">👤</div><span>${user.email.split('@')[0]}</span><span style="font-size:10px; color:#888;">▼</span></div>
                            <div class="dropdown-content">
                                <a href="profile.html">👤 ข้อมูลส่วนตัว (Profile)</a><a href="wallet.html">💰 กระเป๋าเงิน (Wallet)</a><a href="#" id="logoutBtn" class="logout-item">🚪 ออกจากระบบ</a>
                            </div>
                        </div>`;
                    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                        e.preventDefault();
                         if(await showConfirm("ยืนยัน","ออกจากระบบ?")) {
                              await signOut(auth);
                              window.location.href='login.html';
                        }
                    });
                }
            } else {
                 if(authSection) authSection.innerHTML = `<div style="display:flex; gap:10px;"><a href="login.html" class="btn btn-login">เข้าสู่ระบบ</a><a href="register.html" class="btn btn-register">สมัครสมาชิก</a></div>`;
            }
        });

        // Main Logic
        async function initSchedule() {
            try {
                const events = await getEvents();
                const allTrash = await getTrashTypes(); // ดึงรายการขยะทั้งหมดมาเทียบ ID
                const container = document.getElementById('scheduleList');

                if (events.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color:#666; padding:40px;">ไม่มีกิจกรรมเร็วๆ นี้</div>';
                    return;
                }

                events.sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

                container.innerHTML = events.map(evt => {
                    const d = evt.date ? new Date(evt.date) : new Date();
                    const day = d.getDate();
                    const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
                    const month = months[d.getMonth()];

                    // 1. กรองรายการขยะที่จุดรับซื้อนี้ยอมรับ (Accepted Trash)
                    const acceptedTrashList = allTrash.filter(t => 
                        evt.accepted_trash_ids && evt.accepted_trash_ids.includes(t.id)
                    );

                    // 2. สร้าง HTML สำหรับ Tags (หน้าการ์ด)
                    let tagsHtml = '';
                    if (acceptedTrashList.length > 0) {
                        // โชว์แค่ 3 อันแรก ถ้าเยอะเกิน
                        tagsHtml = acceptedTrashList.slice(0, 3).map(t => `<span class="tag">${t.name}</span>`).join('');
                        if (acceptedTrashList.length > 3) tagsHtml += `<span class="tag">+${acceptedTrashList.length - 3}</span>`;
                    } else {
                        tagsHtml = `<span class="tag" style="color:#666; background:rgba(255,255,255,0.05);">รับทุกประเภท</span>`;
                    }

                    // 3. สร้าง HTML สำหรับตารางใน Dropdown (เฉพาะที่รับซื้อ)
                    let tableRows = '';
                    if (acceptedTrashList.length > 0) {
                        tableRows = acceptedTrashList.map(t => `
                            <tr>
                                <td>${t.icon || '📦'} ${t.name}</td>
                                <td style="color: var(--primary-color); font-weight:bold;">${t.price_per_unit} ฿/kg</td>
                                <td style="color:#888;">${t.category}</td>
                            </tr>
                        `).join('');
                    } else {
                        // ถ้ารับทุกอย่าง หรือไม่ได้ระบุ ให้โชว์ทั้งหมด (Fallback)
                        tableRows = allTrash.map(t => `
                            <tr>
                                <td>${t.icon || '📦'} ${t.name}</td>
                                <td style="color: var(--primary-color); font-weight:bold;">${t.price_per_unit} ฿/kg</td>
                                <td style="color:#888;">${t.category}</td>
                            </tr>
                        `).join('');
                    }

                    // สถานะ
                    let statusHtml = '<span class="st-wait">⏳ รอดำเนินการ</span>';
                    if(evt.status === 'open') statusHtml = '<span class="st-open">● เปิดรับซื้อ</span>';
                    else if(evt.status === 'closed') statusHtml = '<span class="st-closed">● ปิดรับซื้อ</span>';

                    return `
                    <div class="schedule-card" onclick="this.classList.toggle('expanded')">
                        <div class="card-header-row">
                            <div class="date-box">
                                <div class="date-day">${day}</div>
                                <div class="date-month">${month}</div>
                            </div>
                            <div style="flex: 1;">
                                <h3 style="font-size: 18px; margin-bottom: 5px; color:#fff;">📍 ${evt.name}</h3>
                                <div style="margin-bottom: 5px; color: #848e9c; font-size: 14px;">เวลา: 09:00 - 16:00 น. | ${evt.district}</div>
                                <div>${tagsHtml}</div> </div>
                            <div style="text-align: right;">
                                <div>${statusHtml}</div>
                                <div class="expand-hint">กดเพื่อดูรายละเอียด ▼</div>
                            </div>
                        </div>
                        
                        <div class="card-details">
                            <h4 style="font-size: 14px; margin-bottom: 15px; color: var(--primary-color); border-bottom:1px solid #333; padding-bottom:10px;">📋 ราคารับซื้อวันนี้ (เฉพาะรายการที่จุดนี้รับ)</h4>
                            <table class="detail-table">
                                <thead><tr><th width="50%">ประเภทขยะ</th><th width="30%">ราคาปัจจุบัน</th><th width="20%">หมวดหมู่</th></tr></thead>
                                <tbody>
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>
                    </div>`;
                }).join('');

            } catch (err) { console.error(err); }
        }

        initSchedule();
    </script>
</body>
</html>
