<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECOBANK</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW registered: ', reg.scope))
            .catch(err => console.log('SW failed: ', err));
        });
      }
    </script>
  </head>
  <body>
    <header class="header"></header>

    <main class="container animate-fade-in">
        <section class="hero-section">
            <h1 class="hero-title animate-slide-up">เปลี่ยนขยะให้เป็นเงินทอง</h1>
            <p class="hero-subtitle animate-slide-up" style="animation-delay: 0.1s;">ร่วมสร้างสังคมคาร์บอนต่ำไปกับ ECOBANK</p>
        </section>

        <!-- Stats Grid -->
        <div class="home-stats-grid">
            <div class="home-stat-card">
                <div class="h-icon-box" style="color:#b2ff59;">👥</div>
                <div class="h-label">สมาชิกทั้งหมด</div>
                <div class="h-value" id="totalMembers">...</div>
                <div class="h-unit">คน</div>
                <div class="h-trend trend-up" id="trendMembers">...</div>
            </div>
            <div class="home-stat-card">
                <div class="h-icon-box" style="color:#0ecb81;">♻️</div>
                <div class="h-label">ขยะที่รีไซเคิลแล้ว</div>
                <div class="h-value" id="totalWeight">...</div>
                <div class="h-unit">kg</div>
                <div class="h-trend trend-up" id="trendWeight">...</div>
            </div>
            <div class="home-stat-card">
                <div class="h-icon-box" style="color:#f0b90b;">💸</div>
                <div class="h-label">มูลค่าหมุนเวียน</div>
                <div class="h-value" id="totalMoney">...</div>
                <div class="h-unit">฿</div>
                <div class="h-trend trend-up" id="trendMoney">...</div>
            </div>
            <div class="home-stat-card">
                <div class="h-icon-box" style="color:#00d2ff;">🌍</div>
                <div class="h-label">ลด CO₂ ได้</div>
                <div class="h-value" id="co2Saved">...</div>
                <div class="h-unit">kgCO₂</div>
                <div class="h-trend trend-up">↗ เทียบเท่าปลูกต้นไม้ <span id="treeSaved">...</span> ต้น</div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="section-header">
            <div class="page-title" style="font-size:24px; margin:0;">📈 ราคาขยะล่าสุด</div>
            <a href="trash_types.html" class="btn btn-outline">ดูทั้งหมด →</a>
        </div>

        <div class="table-card">
            <table class="home-table" id="priceTable">
                <!-- Data will be injected here -->
                <tr><td colspan="4" style="text-align:center; padding:40px; color:#666;">กำลังโหลดข้อมูล...</td></tr>
            </table>
        </div>
        
    </main>

    <footer class="site-footer"></footer>

    <script type="module">
      import {
        getCommunityStats,
        getTrashTypes,
        showConfirm,
        calculateImpact
      } from "./js/firebase-service.js";
      import {
        getAuth,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import { auth } from "./js/firebase-config.js";
      import { renderHeader, renderFooter } from "./js/components.js";

      // 1. Render Components
      renderHeader('home');
      renderFooter();

      // 2. Auth Logic (Moved from inline to here, adapting to new header structure)
      onAuthStateChanged(auth, (user) => {
          const authSection = document.getElementById('authSection');
          if (user) {
              authSection.innerHTML = `
                  <div class="user-dropdown">
                      <div class="user-btn"><div class="user-avatar-xs">👤</div><span>${user.email.split('@')[0]}</span><span style="font-size:10px; color:#888;">▼</span></div>
                      <div class="dropdown-content">
                          <a href="profile.html">👤 ข้อมูลส่วนตัว (Profile)</a><a href="wallet.html">💰 กระเป๋าเงิน (Wallet)</a><a href="#" id="logoutBtn" class="logout-item">🚪 ออกจากระบบ</a>
                      </div>
                  </div>`;
              document.getElementById('logoutBtn').addEventListener('click', async (e) => { e.preventDefault(); if(await showConfirm("ยืนยัน","ออกจากระบบ?")) { await signOut(auth); window.location.reload(); } });
          } else {
              authSection.innerHTML = `<a href="login.html" class="btn btn-login">เข้าสู่ระบบ</a><a href="register.html" class="btn btn-register">สมัครสมาชิก</a>`;
          }
      });
      
      // 3. Load Data
      async function loadData() {
          // Stats
          // Stats
          const stats = await getCommunityStats();
          animateValue("totalMembers", 0, stats.members, 1000);
          animateValue("totalWeight", 0, parseFloat(stats.weight), 1500);
          animateValue("totalMoney", 0, parseFloat(stats.money), 1500);

          // Update Trends (Real Data) - Added safe defaults
          document.getElementById('trendMembers').innerText = `↗ +${stats.newMembersMonth || 0} คน เดือนนี้`;
          document.getElementById('trendWeight').innerText = `↗ +${stats.weightToday || 0} kg วันนี้`;
          document.getElementById('trendMoney').innerText = `↗ +฿${stats.moneyToday || 0} วันนี้`;

          // Impact Calculation
          const impact = calculateImpact(parseFloat(stats.weight));
          animateValue("co2Saved", 0, parseFloat(impact.co2), 2000); 
          document.getElementById('treeSaved').innerText = parseFloat(impact.trees).toFixed(0);

          // Prices (Show top 5)
          const prices = await getTrashTypes();
          const table = document.getElementById('priceTable');
          if(prices.length === 0) { table.innerHTML = '<tr><td colspan="4" style="text-align:center;">ไม่พบข้อมูล</td></tr>'; return; }
          
          table.innerHTML = prices.slice(0, 5).map(item => `
              <tr>
                  <td style="width:50%;">
                      <div style="display:flex; align-items:center;">
                          <span class="trash-icon-sm">${item.icon}</span>
                          <div>
                              <div style="font-weight:600; color:#eaecef;">${item.name}</div>
                              <span class="badge-cate">${item.category}</span>
                          </div>
                      </div>
                  </td>
                  <td class="text-price">${item.price_per_unit.toFixed(2)} ฿</td>
                  <td style="color:#848e9c; font-size:13px;">/${item.unit}</td>
                  <td style="text-align:right;">
                      <span class="${item.trend === 'up' ? 'text-up' : (item.trend === 'down' ? 'text-down' : 'text-muted')}">
                          ${item.trend === 'up' ? '▲' : (item.trend === 'down' ? '▼' : '●')}
                      </span>
                  </td>
              </tr>
          `).join('');
      }

      function animateValue(id, start, end, duration) {
          const obj = document.getElementById(id);
          if (!obj) return;
          let startTimestamp = null;
          const step = (timestamp) => {
              if (!startTimestamp) startTimestamp = timestamp;
              const progress = Math.min((timestamp - startTimestamp) / duration, 1);
              const val = Math.floor(progress * (end - start) + start);
              obj.innerHTML = val.toLocaleString();
              if (progress < 1) window.requestAnimationFrame(step);
          };
          window.requestAnimationFrame(step);
      }

      loadData();
    </script>
  </body>
</html>
