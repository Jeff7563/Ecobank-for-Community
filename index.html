<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECOBANK</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW registered: ', reg.scope))
            .catch(err => console.log('SW failed: ', err));
        });
      }
    </script>
    <style>
        /* Expandable Card CSS (Ported from exchange.html) */
        .price-card {
            background: #1e2329; border: 1px solid #2b3139; border-radius: 12px; padding: 20px;
            margin-bottom: 12px; transition: all 0.3s ease; cursor: pointer;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .price-card:hover { border-color: var(--primary-color); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .pc-header { display: flex; align-items: center; justify-content: space-between; width: 100%; z-index: 2; }
        .pc-info { display: flex; align-items: center; gap: 15px; }
        .pc-icon { font-size: 28px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 8px; }
        
        .pc-details {
            max-height: 0; opacity: 0; overflow: hidden; transition: all 0.4s ease;
            margin-top: 0; background: #15181d; border-radius: 8px;
        }
        /* Hover to Expand */
        .price-card:hover .pc-details { max-height: 300px; opacity: 1; margin-top: 15px; padding: 15px; border-top: 1px solid #2b3139; }
        
        .pc-hint { font-size: 11px; color: #555; margin-top: 5px; text-align: right; transition: 0.3s; }
        .price-card:hover .pc-hint { opacity: 0; }
        
        .comparison-table { width: 100%; font-size: 13px; margin-top: 10px; border-collapse: separate; border-spacing: 0 5px; }
        .comparison-table td { padding: 8px; background: #1e2329; border-radius: 4px; color: #ccc; }
        .c-label { color: #848e9c; width: 40%; }
        .c-val { font-weight: bold; text-align: right; }
        .c-diff { text-align: right; font-size: 11px; width: 25%; }
        
        .diff-up { color: #0ecb81; }
        .diff-down { color: #f6465d; }

        /* PWA Install Button */
        #installPwaBtn {
            position: fixed; bottom: 85px; left: 20px;
            background: linear-gradient(135deg, #0ecb81, #00C851);
            color: #fff; border: none; padding: 10px 20px;
            border-radius: 50px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(14, 203, 129, 0.4);
            display: none; align-items: center; gap: 8px; z-index: 1000;
            cursor: pointer; animation: floatBtn 3s ease-in-out infinite;
        }
        @media (min-width: 769px) { #installPwaBtn { display: none !important; } } /* Hide on Desktop */
        @keyframes floatBtn { 0% { transform: translateY(0); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0); } }

        /* Install Modal (Universal) */
        .install-modal {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: #1e2329; border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 25px; border-top: 1px solid #2b3139; z-index: 2000;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.6);
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .install-step { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 20px; color: #ccc; }
        .install-icon-box { 
            width: 40px; height: 40px; background: rgba(255,255,255,0.05); 
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0; color: var(--primary-color);
        }
        .install-text { font-size: 14px; line-height: 1.5; padding-top: 2px; }
        .install-highlight { color: #fff; font-weight: bold; }

        /* --- Mobile Header Fixes (Inline Force) --- */
        @media (max-width: 480px) {
            .header { padding: 10px 15px !important; }
            .logo { font-size: 20px !important; }
            .btn, .btn-login, .btn-register {
                padding: 6px 10px !important;
                font-size: 11px !important;
                white-space: nowrap !important;
                height: 32px !important;
                display: flex !important; align-items: center !important;
            }
            #authSection div { gap: 5px !important; }
        }
    </style>
  </head>
  <body>
    <header class="header"></header>

    <main class="container animate-fade-in">
        <section class="hero-section">
            <h1 class="hero-title animate-slide-up">เปลี่ยนขยะให้เป็นเงินทอง</h1>
            <p class="hero-subtitle animate-slide-up" style="animation-delay: 0.1s;">ร่วมสร้างสังคมคาร์บอนต่ำไปกับ ECOBANK</p>
        </section>

        <!-- Stats Grid -->
        <div class="home-stats-grid">
            <div class="home-stat-card">
                <div class="h-icon-box" style="color:#b2ff59;">👥</div>
                <div class="h-label">สมาชิกทั้งหมด</div>
                <div class="h-value" id="totalMembers">...</div>
                <div class="h-unit">คน</div>
                <div class="h-trend trend-up" id="trendMembers">...</div>
            </div>
            <div class="home-stat-card">
                <div class="h-icon-box" style="color:#0ecb81;">♻️</div>
                <div class="h-label">ขยะที่รีไซเคิลแล้ว</div>
                <div class="h-value" id="totalWeight">...</div>
                <div class="h-unit">kg</div>
                <div class="h-trend trend-up" id="trendWeight">...</div>
            </div>
            <div class="home-stat-card">
                <div class="h-icon-box" style="color:#f0b90b;">💸</div>
                <div class="h-label">มูลค่าหมุนเวียน</div>
                <div class="h-value" id="totalMoney">...</div>
                <div class="h-unit">฿</div>
                <div class="h-trend trend-up" id="trendMoney">...</div>
            </div>
            <div class="home-stat-card">
                <div class="h-icon-box" style="color:#00d2ff;">🌍</div>
                <div class="h-label">ลด CO₂ ได้</div>
                <div class="h-value" id="co2Saved">...</div>
                <div class="h-unit">kgCO₂</div>
                <div class="h-trend trend-up">↗ เทียบเท่าปลูกต้นไม้ <span id="treeSaved">...</span> ต้น</div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="section-header" style="justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div class="page-title" style="font-size:24px; margin:0;">📈 ราคาขยะล่าสุด</div>
            <a href="trash_types.html" class="btn btn-outline" style="font-size: 14px;">ดูทั้งหมด →</a>
        </div>


        <div id="priceList" class="price-list-container">
            <div style="text-align:center; padding:40px; color:#666;">กำลังโหลดข้อมูล...</div>
        </div>
        
    </main>

    <footer class="site-footer"></footer>
    
    <!-- Install PWA Button -->
    <button id="installPwaBtn" onclick="installPWA()">
        <span>📲</span> ติดตั้งแอป
    </button>

    <!-- Install Instruction Modal -->
    <div id="installModal" class="install-modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div style="font-weight:bold; color:#fff;" id="installModalTitle">วิธีติดตั้งลงเครื่อง</div>
            <button onclick="closeInstallModal()" style="background:none; border:none; color:#888; font-size:24px;">×</button>
        </div>
        
        <!-- dynamic content -->
        <div id="installSteps"></div>
    </div>

    <script type="module">
      import {
        getCommunityStats,
        getTrashTypes,
        showConfirm,
        calculateImpact
      } from "./js/firebase-service.js";
      import {
        getAuth,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import { auth } from "./js/firebase-config.js";
      import { renderHeader, renderFooter } from "./js/components.js";

      // 1. Render Components
      renderHeader('home');
      renderFooter();

      // 2. Auth Logic (Moved from inline to here, adapting to new header structure)
      onAuthStateChanged(auth, (user) => {
          const authSection = document.getElementById('authSection');
          if (user) {
              authSection.innerHTML = `
                  <div class="user-dropdown">
                      <div class="user-btn"><div class="user-avatar-xs">👤</div><span>${user.email.split('@')[0]}</span><span style="font-size:10px; color:#888;">▼</span></div>
                      <div class="dropdown-content">
                          <a href="profile.html">👤 ข้อมูลส่วนตัว (Profile)</a><a href="wallet.html">💰 กระเป๋าเงิน (Wallet)</a><a href="#" id="logoutBtn" class="logout-item">🚪 ออกจากระบบ</a>
                      </div>
                  </div>`;
              document.getElementById('logoutBtn').addEventListener('click', async (e) => { e.preventDefault(); if(await showConfirm("ยืนยัน","ออกจากระบบ?")) { await signOut(auth); window.location.reload(); } });
          } else {
              authSection.innerHTML = `<div style="display:flex; gap:10px;"><a href="login.html" class="btn btn-login">เข้าสู่ระบบ</a><a href="register.html" class="btn btn-register">สมัครสมาชิก</a></div>`;
          }
      });
      
      // 3. Load Data
      async function loadData() {
          // Stats
          // Stats
          const stats = await getCommunityStats();
          animateValue("totalMembers", 0, stats.members, 1000);
          animateValue("totalWeight", 0, parseFloat(stats.weight), 1500);
          animateValue("totalMoney", 0, parseFloat(stats.money), 1500);

          // Update Trends (Real Data) - Added safe defaults
          document.getElementById('trendMembers').innerText = `↗ +${stats.newMembersMonth || 0} คน เดือนนี้`;
          document.getElementById('trendWeight').innerText = `↗ +${stats.weightToday || 0} kg วันนี้`;
          document.getElementById('trendMoney').innerText = `↗ +฿${stats.moneyToday || 0} วันนี้`;

          // Impact Calculation
          const impact = calculateImpact(parseFloat(stats.weight));
          animateValue("co2Saved", 0, parseFloat(impact.co2), 2000); 
          document.getElementById('treeSaved').innerText = parseFloat(impact.trees).toFixed(0);

          // Prices Logic using Expandable Cards
          const prices = await getTrashTypes();
          const listContainer = document.getElementById('priceList');

          if(prices.length === 0) { listContainer.innerHTML = '<div style="text-align:center; padding:40px; color:#666;">ไม่พบข้อมูล</div>'; return; }
          
          listContainer.innerHTML = prices.slice(0, 5).map(item => {
              // Historical Data (From Admin Input)
              const current = item.price_per_unit;
              
              // Use saved historical prices, or default to current (0% change) if not set
              // This fixes the "Random on refresh" issue
              const priceMonth = item.price_month || current; 
              const priceYear = item.price_year || current;
              
              const diffMonth = priceMonth > 0 ? ((current - priceMonth) / priceMonth) * 100 : 0;
              const diffYear = priceYear > 0 ? ((current - priceYear) / priceYear) * 100 : 0;
              
              const formatDiff = (val) => {
                  const s = val > 0 ? '+' : '';
                  const c = val > 0 ? 'diff-up' : (val < 0 ? 'diff-down' : '');
                  return `<span class="${c}">${s}${val.toFixed(1)}%</span>`;
              };

              return `
              <div class="price-card">
                  <div class="pc-header">
                      <div class="pc-info">
                          <div class="pc-icon">${item.icon}</div>
                          <div>
                              <div style="font-weight:600; color:#eaecef; font-size:16px;">${item.name}</div>
                              <span class="badge-cate">${item.category}</span>
                          </div>
                      </div>
                      <div style="text-align:right;">
                          <div style="color: #0ecb81; font-weight:bold; font-size:18px;">${current.toFixed(2)} ฿</div>
                          <div style="color:#666; font-size:12px;">ต่อ ${item.unit}</div>
                          <div class="pc-hint" onclick="this.closest('.price-card').classList.toggle('expanded')">
                              <span>ดูแนวโน้ม</span> <span style="font-size:10px;">▼</span>
                          </div>
                      </div>
                  </div>
                  
                  <div class="pc-details">
                      <div style="font-size:12px; color:#848e9c; border-bottom:1px solid #333; padding-bottom:5px; margin-bottom:5px;">📊 เปรียบเทียบราคาตลาด</div>
                      <table class="comparison-table">
                          <tr>
                              <td class="c-label">เดือนที่แล้ว</td>
                              <td class="c-val">${priceMonth.toFixed(2)} ฿</td>
                              <td class="c-diff">${formatDiff(diffMonth)}</td>
                          </tr>
                          <tr>
                              <td class="c-label">ปีที่แล้ว</td>
                              <td class="c-val">${priceYear.toFixed(2)} ฿</td>
                              <td class="c-diff">${formatDiff(diffYear)}</td>
                          </tr>
                      </table>
                  </div>
              </div>`;
          }).join('');
      }

      function animateValue(id, start, end, duration) {
          const obj = document.getElementById(id);
          if (!obj) return;
          let startTimestamp = null;
          const step = (timestamp) => {
              if (!startTimestamp) startTimestamp = timestamp;
              const progress = Math.min((timestamp - startTimestamp) / duration, 1);
              const val = Math.floor(progress * (end - start) + start);
              obj.innerHTML = val.toLocaleString();
              if (progress < 1) window.requestAnimationFrame(step);
          };
          window.requestAnimationFrame(step);
      }

      loadData();

      // --- PWA Logic ---
       let deferredPrompt;
       const installBtn = document.getElementById('installPwaBtn');
       const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

       // Auto-show button only on mobile
       if (isMobile) {
            // Wait for prompt or just show button for manual install
            // But we hide it by default in CSS, so logic here determines display
            setTimeout(() => {
                 if (!window.matchMedia('(display-mode: standalone)').matches) {
                      installBtn.style.display = 'flex';
                 }
            }, 1000);
       }

       window.addEventListener('beforeinstallprompt', (e) => {
           e.preventDefault();
           deferredPrompt = e;
           if(isMobile) installBtn.style.display = 'flex';
       });

       window.installPWA = () => {
           const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
           const isAndroid = /Android/.test(navigator.userAgent);
           const modal = document.getElementById('installModal');
           const content = document.getElementById('installSteps');
           const title = document.getElementById('installModalTitle');

           if (isIos) {
               title.innerText = 'ติดตั้งบน iPhone/iPad';
               content.innerHTML = `
                   <div class="install-step">
                       <div class="install-icon-box">📤</div>
                       <div class="install-text">กดปุ่ม <span class="install-highlight">"แชร์"</span> (ไอคอนลูกศรชี้ขึ้น) ที่แถบเมนูด้านล่าง Safari</div>
                   </div>
                   <div class="install-step">
                       <div class="install-icon-box">⊞</div>
                       <div class="install-text">เลื่อนหาและกดเมนู <span class="install-highlight">"เพิ่มไปยังหน้าจอโฮม"</span> (Add to Home Screen)</div>
                   </div>
                   <div class="install-step">
                       <div class="install-icon-box">✨</div>
                       <div class="install-text">กดปุ่ม <span class="install-highlight">"เพิ่ม"</span> (Add) ที่มุมขวาบนเพื่อเสร็จสิ้น</div>
                   </div>
               `;
               modal.style.display = 'block';
           } else if (deferredPrompt) {
               deferredPrompt.prompt();
               deferredPrompt.userChoice.then((choiceResult) => {
                   if (choiceResult.outcome === 'accepted') {
                       installBtn.style.display = 'none';
                   }
                   deferredPrompt = null;
               });
           } else if (isAndroid) {
               // Manual Android Instructions
               title.innerText = 'ติดตั้งบน Android (Chrome)';
               content.innerHTML = `
                   <div class="install-step">
                       <div class="install-icon-box">⋮</div>
                       <div class="install-text">กดปุ่ม <span class="install-highlight">"จุด 3 จุด"</span> ที่มุมขวาบนของ Chrome</div>
                   </div>
                   <div class="install-step">
                       <div class="install-icon-box">📲</div>
                       <div class="install-text">เลือกเมนู <span class="install-highlight">"ติดตั้งแอป"</span> (Install App) หรือ เพิ่มลงหน้าจอหลัก</div>
                   </div>
                   <div class="install-step">
                       <div class="install-icon-box">✅</div>
                       <div class="install-text">กดยืนยันการติดตั้งในหน้าต่างที่ปรากฏ</div>
                   </div>
               `;
               modal.style.display = 'block';
           } else {
               alert('อุปกรณ์ของคุณไม่รองรับการติดตั้งอัตโนมัติ กรุณาใช้เมนูของ Browser');
           }
       };

       window.closeInstallModal = () => {
           document.getElementById('installModal').style.display = 'none';
       };
    </script>
  </body>
</html>
